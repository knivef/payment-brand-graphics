<!doctype html>
<!-- Starter 1080x1080 slide. Copy next to ./kit (from brand_kit.py), bg.jpg (Steps 1-2) and shot.png. Replace every {{...}}. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit/tokens.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1080px;background:var(--page);font-family:Inter,system-ui,sans-serif;color:var(--ink);overflow:hidden}
.page{position:relative;width:1080px;height:1080px;display:flex;flex-direction:column;padding:48px 132px 30px}
.guide{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.guide{z-index:2;pointer-events:none}
/* Header and footer rules bleed off both edges; diamonds sit where they cross the guides (x 120 and 960). */
.head,.foot{position:relative}
.head::after,.foot::before{content:"";position:absolute;left:-132px;right:-132px;height:1px;background:var(--line)}
.head::after{bottom:-1px}.foot::before{top:-14px}
.dia{position:absolute;z-index:3;width:7px;height:7px;background:var(--page);border:1px solid #cfcfcf;transform:translate(-50%,-50%) rotate(45deg)}
.head .dia{top:100%}.foot .dia{top:-14px}.dl{left:-12px}.dr{left:calc(100% + 12px)}
.eyebrow{display:flex;gap:14px;font-size:16px;font-weight:600;color:var(--muted)}
.eyebrow b{color:var(--accent-ink);font-weight:600}
h1{font-size:52px;font-weight:650;letter-spacing:-.035em;line-height:1.05;margin-top:22px}
h1 em{font-style:normal;color:var(--accent-ink)}
.sub{font-size:22px;color:var(--muted);margin-top:14px;line-height:1.35;padding-bottom:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--card-border);border-radius:10px;margin-top:26px;overflow:hidden}
.stat{padding:16px 20px 18px;border-left:1px solid var(--card-border)}
.stat:first-child{border-left:0;box-shadow:inset 0 -3px 0 var(--accent)}
.lab{font-size:17px;color:var(--muted);display:flex;align-items:center;gap:8px}
.lab i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.stat:nth-child(2) .lab i{background:var(--dot-2)} .stat:nth-child(3) .lab i{background:var(--dot-3)}
.val{font-size:38px;font-weight:600;letter-spacing:-.03em;margin-top:6px}
.panel{flex:1;min-height:0;margin:26px -132px 0;padding:22px 132px;background:url(bg.jpg) center/cover;display:flex;align-items:center;justify-content:center}
.win{width:100%;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 24px 60px -10px rgba(30,20,40,.45),0 0 0 1px rgba(0,0,0,.12)}
.bar{height:44px;background:linear-gradient(#f1f1f1,#e6e6e6);display:flex;align-items:center;padding:0 16px;position:relative}
.bar span{width:13px;height:13px;border-radius:50%;margin-right:8px}
.wtitle{position:absolute;left:0;right:0;text-align:center;font-size:16px;color:#555;pointer-events:none}
.win img{display:block;width:100%;max-height:430px;object-fit:cover;object-position:top}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:28px;font-size:15px;color:var(--muted)}
.foot img{height:36px}
</style></head><body><div class="page">
<div class="guide" style="left:120px"></div><div class="guide" style="left:960px"></div>
<div class="head"><span class="dia dl"></span><span class="dia dr"></span>
<div class="eyebrow"><span>1 / 4</span><b>{{EYEBROW}}</b></div>
<h1>{{HEADLINE, one word may be wrapped in <em>}}</h1>
<p class="sub">{{SUB LINE}}</p></div>
<div class="stats">
  <div class="stat"><div class="lab"><i></i>{{LABEL 1}}</div><div class="val">{{HERO VALUE}}</div></div>
  <div class="stat"><div class="lab"><i></i>{{LABEL 2}}</div><div class="val">{{VALUE 2}}</div></div>
  <div class="stat"><div class="lab"><i></i>{{LABEL 3}}</div><div class="val">{{VALUE 3}}</div></div>
</div>
<div class="panel"><div class="win">
  <div class="bar"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span><div class="wtitle">{{BRAND}} · {{SOURCE}}</div></div>
  <img src="shot.png" alt="">
</div></div>
<div class="foot"><span class="dia dl"></span><span class="dia dr"></span><img src="kit/wordmark_black.svg" alt=""><span>{{Source: ...}} · {{DOMAIN}}</span></div>
</div></body></html>
